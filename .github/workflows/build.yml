name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Makefile is the single record of the build command, the C++ standard, and the
      # artifact name, so the workflow builds through it rather than repeating the command.
      - name: Build with make
        run: make

      # The program prompts on stdout and reads two integers from stdin, so every
      # invocation pipes its input and every expected block starts with both prompts.
      # Inputs are fed with `printf '%s\n' <a> <b>` so a negative endpoint is not
      # mistaken for a command-line option. The run is bounded by `timeout` and `head`
      # so that a loop which steps past its endpoint fails the diff instead of filling
      # the log.
      - name: Check the output of each branch
        run: |
          check() {
            name="$1"; first="$2"; last="$3"; shift 3
            printf '%s\n' \
              'What is the first number in the range?' \
              'What is the last number in the range?' \
              "$@" > "$RUNNER_TEMP/expected.txt"
            printf '%s\n' "$first" "$last" | timeout 5 ./printRange | head -n 100 > "$RUNNER_TEMP/actual.txt"
            if diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"; then
              echo "PASS: $name"
            else
              echo "FAIL: $name"
              exit 1
            fi
          }
          check 'ascending' 1 5 1 2 3 4 5
          check 'descending' 5 1 5 4 3 2 1
          check 'equal endpoints' 3 3 3
          check 'crossing zero' -2 2 -2 -1 0 1 2
          check 'ascending to INT_MAX' 2147483645 2147483647 2147483645 2147483646 2147483647
          check 'descending to INT_MIN' -2147483646 -2147483648 -2147483646 -2147483647 -2147483648
          check 'equal endpoints at INT_MAX' 2147483647 2147483647 2147483647

      # Input that cannot be read as an int is rejected: the program exits with status 1,
      # names the offending number on stderr, and prints no range on stdout.
      - name: Check that unreadable input is rejected
        run: |
          reject() {
            name="$1"; message="$2"; shift 2
            status=0
            printf '%s\n' "$@" | timeout 5 ./printRange > "$RUNNER_TEMP/actual.txt" 2> "$RUNNER_TEMP/error.txt" || status=$?
            if test "$status" -eq 1 \
              && grep -qxF "$message" "$RUNNER_TEMP/error.txt" \
              && ! grep -qE '^-?[0-9]+$' "$RUNNER_TEMP/actual.txt"; then
              echo "PASS: $name"
            else
              echo "FAIL: $name (exit $status)"
              cat "$RUNNER_TEMP/error.txt"
              head -n 5 "$RUNNER_TEMP/actual.txt"
              exit 1
            fi
          }
          reject 'non-numeric first number' 'The first number could not be read as an integer.' foo bar
          reject 'non-numeric last number' 'The last number could not be read as an integer.' 3 xyz
          reject 'first number outside int' 'The first number could not be read as an integer.' 99999999999 1
          reject 'last number outside int' 'The last number could not be read as an integer.' 1 99999999999
          reject 'characters attached to the first number' 'The first number could not be read as an integer.' 5abc 7
          reject 'decimal first number' 'The first number could not be read as an integer.' 1.5 3
          reject 'characters attached to the last number' 'The last number could not be read as an integer.' 7 9x
          reject 'blank input' 'The first number could not be read as an integer.' ''

      # A wide range is checked by line count rather than by a literal block. The two
      # prompt lines are dropped first, so 1 through 100 inclusive must leave 100 lines.
      - name: Check that both endpoints are printed over a wide range
        run: |
          lines=$(printf '%s\n' 1 100 | ./printRange | tail -n +3 | wc -l)
          echo "range lines: $lines"
          test "$lines" -eq 100

      # The README states that `make clean` removes the binary, so that target is run too
      # rather than left as an unexercised claim.
      - name: Check that make clean removes the binary
        run: |
          make clean
          test ! -e printRange
